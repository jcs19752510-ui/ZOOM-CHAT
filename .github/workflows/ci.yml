name: CI
on:
  push:
    branches: [PROD, PROD_SCH, main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:docs
      - run: npm audit --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
  coturn:
    # SEC-12: 저장소의 실제 turnserver.conf로 coturn(compose와 같은 이미지)을 띄워 공인 허용·사설 거부를 실측한다
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker pull "$(sed -n 's/^ *image: *//p' infra/docker-compose.yml | head -1)"
      - run: npx vitest run --root apps/server test/coturnLive.test.ts test/coturnConfig.test.ts
        env:
          COTURN_LIVE: '1'
          REQUIRE_COTURN: '1'
          COTURN_RUNNER: docker
