# MeetLite coturn 설정(개발용 기본값). 시크릿은 명령행(--static-auth-secret)으로만 넘기고 파일에 쓰지 않는다.
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200
fingerprint
use-auth-secret
no-cli
no-tlsv1
no-tlsv1_1
# 남용 방지(SEC-09): 멀티캐스트와 사설·루프백·링크로컬 대역으로의 릴레이 차단
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# IPv6: 루프백(::1), (주의: "::"로 시작하는 범위는 공인 IPv4 peer까지 거부하는 결함이 있어 쓰지 않는다, 03-system-design D-1) IPv4-mapped(::ffff:0:0/96, IPv4 차단 우회 방지), 사설(fc00::/7), 링크로컬(fe80::/10), 멀티캐스트(ff00::/8)
denied-peer-ip=::1-::1
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# 할당량(사용자당 동시 할당, 전체 동시 할당 수). 값은 운영 중 조정한다.
# max-bps의 단위는 바이트/초다(turnserver --help). 1500000 = 세션당 약 12Mbps. 1.5Mbps를 의도했다면 187500이지만, 6인 메시에서 화면공유 영상이 끊길 수 있어 값은 바꾸지 않았다(unit-18).
# bps-capacity=0은 서버 전체 대역폭 상한 없음이다. 총량은 total-quota와 호스트 네트워크 정책으로 제한한다.
user-quota=12
total-quota=300
bps-capacity=0
max-bps=1500000
stale-nonce=600
no-software-attribute
# simple-log는 로그 파일 롤오버를 끄고 파일명에 PID·날짜를 붙이지 않는 파일명 옵션이다. 로그 내용(IP·사용자명)을 줄이지 않는다.
# 개인정보 최소화는 로그 보존 기간으로 한다: 컨테이너 로그는 infra/docker-compose.yml의 로테이션(POL-18)을 따른다.
simple-log
