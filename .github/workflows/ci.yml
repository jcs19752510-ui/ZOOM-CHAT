name: CI
on:
  push:
    branches: [PROD, PROD_SCH, main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:docs
      - run: npm audit --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # IT-21·22·46(TURN 경유)은 로컬 turnserver가 필요하다. 설치되지 않으면 시험이 조용히 건너뛰어지므로 설치한다.
      - run: sudo apt-get update && sudo apt-get install -y coturn
      - run: npm run build
      - run: npm run test:e2e
  coturn:
    # SEC-12: 저장소의 실제 turnserver.conf로 coturn(compose와 같은 이미지)을 띄워 공인 허용·사설 거부를 실측한다
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          IMAGE="$(sed -n 's/^ *image: *//p' infra/docker-compose.yml | head -1)"
          docker pull "$IMAGE"
      - run: npx vitest run --root apps/server test/coturnLive.test.ts test/coturnConfig.test.ts
        env:
          COTURN_LIVE: '1'
          REQUIRE_COTURN: '1'
          COTURN_RUNNER: docker
