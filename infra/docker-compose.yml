# 개발용 coturn. 사용법: TURN_SECRET=<서버 .env의 TURN_SECRET과 같은 값> docker compose -f infra/docker-compose.yml up
# 운영에서는 TLS(turns), 방화벽(3478, 5349, 49160-49200 UDP/TCP), 외부 IP(EXTERNAL_IP)를 반드시 설정하세요.
services:
  coturn:
    image: coturn/coturn:4.9
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET을 설정하세요(서버 .env와 같은 값)}
      TURN_REALM: ${TURN_REALM:-meetlite.local}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${TURN_SECRET}", "--realm=${TURN_REALM:-meetlite.local}"]
